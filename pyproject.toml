[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-etf-universe"
version = "0.1.0"
description = "Comprehensive registry of 350+ Indian ETFs, official AMFI daily NAVs, and premium/discount tracking"
authors = [{ name = "Prathmesh Gupta" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "requests>=2.31.0",
]
